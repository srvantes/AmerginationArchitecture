name: ${COMPOSE_PROJECT_NAME:-amergination}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-amergination-app:local}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    APP_HOST: ${SITE_DOMAIN:?Set SITE_DOMAIN to the canonical hostname without a scheme or path}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-amergination}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-amergination}
    SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
    ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    SQL_ECHO: "false"
    ENABLE_CATALOG_RATE_LIMIT: "true"
    CATALOG_LIMIT_PER_MINUTE: ${CATALOG_LIMIT_PER_MINUTE:-120}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""
    REDIS_DB: "0"
    REDIS_MAX_CONNECTIONS: "100"
    REDIS_CONNECT_TIMEOUT_SECONDS: "1"
    REDIS_SOCKET_TIMEOUT_SECONDS: "1"
    KODIK_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
    KODIK_TOKEN: ${KODIK_TOKEN:-}
    SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME for verification emails}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD to the mail application password}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL}
    SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    EMAIL_SEND_LIMIT_PER_HOUR: ${EMAIL_SEND_LIMIT_PER_HOUR:-5}
    REGISTRATION_LIMIT_PER_HOUR: ${REGISTRATION_LIMIT_PER_HOUR:-3}
    LOGIN_LIMIT_PER_5_MINUTES: ${LOGIN_LIMIT_PER_5_MINUTES:-30}
    LOGIN_ACCOUNT_LIMIT_PER_5_MINUTES: ${LOGIN_ACCOUNT_LIMIT_PER_5_MINUTES:-10}
    COMMENT_LIMIT_PER_HOUR: ${COMMENT_LIMIT_PER_HOUR:-20}
    COMMENT_COOLDOWN_SECONDS: ${COMMENT_COOLDOWN_SECONDS:-15}
    LIKE_LIMIT_PER_MINUTE: ${LIKE_LIMIT_PER_MINUTE:-30}
    DISCUSSION_EDIT_LIMIT_PER_MINUTE: ${DISCUSSION_EDIT_LIMIT_PER_MINUTE:-30}
    REVIEW_LIMIT_PER_HOUR: ${REVIEW_LIMIT_PER_HOUR:-5}
    EXTERNAL_SERVICE_TIMEOUT_SECONDS: ${EXTERNAL_SERVICE_TIMEOUT_SECONDS:-20}
    EXTERNAL_CONNECT_TIMEOUT_SECONDS: ${EXTERNAL_CONNECT_TIMEOUT_SECONDS:-3}
    EXTERNAL_READ_TIMEOUT_SECONDS: ${EXTERNAL_READ_TIMEOUT_SECONDS:-5}
    EXTERNAL_SERVICE_ATTEMPTS: ${EXTERNAL_SERVICE_ATTEMPTS:-2}
    EXTERNAL_RETRY_MAX_DELAY_SECONDS: ${EXTERNAL_RETRY_MAX_DELAY_SECONDS:-2}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amergination}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-amergination}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *logging

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  maintenance:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    volumes:
      - avatars:/app/var/avatars
    networks:
      - backend

  app:
    <<: *app
    restart: unless-stopped
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.80.2
    volumes:
      - avatars:/app/var/avatars
    networks:
      ingress:
        ipv4_address: 172.30.80.3
      backend: {}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8080/health/ready',headers={'Host':os.environ['APP_HOST']}); urllib.request.urlopen(request,timeout=4).close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to the canonical hostname}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      ingress:
        ipv4_address: 172.30.80.2
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

networks:
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  avatars:
  caddy_data:
  caddy_config:
